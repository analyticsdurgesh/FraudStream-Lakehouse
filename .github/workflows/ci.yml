name: FraudStream CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall fraudstream tests

      - name: Run tests
        run: pytest -q

      - name: Secret hygiene check
        run: |
          ! grep -R "github_pat_" .
          ! grep -R "AKIA[0-9A-Z]" .

  kafka-stack:
    # The README's "Kafka Local Stack" path, end to end on a clean machine:
    # boot Kafka, create the topics, produce, land, run bronze -> silver -> gold.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Kafka
        run: |
          cp .env.example .env
          docker compose up -d --wait kafka

      - name: Create the topics
        run: bash scripts/init_kafka_topics.sh

      - name: Produce events for 15 seconds
        run: python -m fraudstream.producers.transaction_simulator --event-rate 20 --duration 15 --fraud-rate 12

      - name: Land the events from Kafka
        run: python -m fraudstream.consumers.landing_consumer --landing-root data/landing --max-messages 100000

      - name: Bronze, silver, gold
        run: bash scripts/run_local_pipeline.sh

      - name: Every gold table has rows
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          tables = sorted(p for p in Path("data/gold").iterdir() if p.is_dir())
          assert len(tables) >= 7, f"expected 7+ gold tables, found {[t.name for t in tables]}"
          for table in tables:
              rows = sum(len(pd.read_parquet(f)) for f in table.glob("*.parquet"))
              print(f"{table.name}: {rows} rows")
              assert rows > 0, f"{table.name} is empty"
          PY

      - name: Kafka logs on failure
        if: failure()
        run: docker compose logs kafka | tail -150

