services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraudstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudstream}
      POSTGRES_DB: ${POSTGRES_DB:-fraudstream}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudstream"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    # The official Apache Kafka image, one node in KRaft mode (no ZooKeeper).
    # Not bitnami/kafka: Bitnami withdrew its free versioned images in Aug 2025,
    # so `bitnami/kafka:3.7` no longer pulls.
    image: apache/kafka:3.7.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners: localhost:9092 for Python on your laptop,
      # kafka:19092 for anything running inside this compose network.
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT://:19092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: cu7Hcz1HRz-MRTsbtTGV5Q
    ports:
      - "9092:9092"
    volumes:
      - ./scripts:/opt/fraudstream/scripts
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-fraudstream}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-fraudstream123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-fraudstream} $${MINIO_SECRET_KEY:-fraudstream123} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-fraudstream-lakehouse} &&
      mc anonymous set download local/$${S3_BUCKET:-fraudstream-lakehouse}"

  dashboard:
    image: python:3.11-slim
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && python -m fraudstream.dashboard.app"
    environment:
      GOLD_DATA_PATH: ${GOLD_DATA_PATH:-data/gold}
      DASH_HOST: ${DASH_HOST:-0.0.0.0}
      DASH_PORT: ${DASH_PORT:-8060}
    ports:
      - "8060:8060"
    volumes:
      - .:/app

volumes:
  minio-data:
